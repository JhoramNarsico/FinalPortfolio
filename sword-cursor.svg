      <stop offset="0%" style="stop-color:#F0F0F0;stop-opacity:1" /> <!-- Lighter silver -->
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" /> <!-- Silver -->
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
